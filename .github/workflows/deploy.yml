name: Deploy to VPS

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'                # Only run if files in backend change
      - 'ecosystem.config.js'       # Or if your PM2 config changes
      - '.github/workflows/deploy.yml' # Or if you edit this pipeline

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Add the NVM bin folder to the system PATH for this session
            export PATH=$PATH:/root/.nvm/versions/node/v24.14.0/bin
            
            cd ~/AI-Resume-Ranker
            git pull origin main
            
            # Install backend dependencies
            cd backend
            npm install
            npx prisma generate
            
            # Go back to the root where ecosystem.config.js lives
            cd ..
            
            # Restart all processes using the config file
            pm2 restart ecosystem.config.js --update-env